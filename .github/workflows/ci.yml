name: CI
on: [ pull_request, push, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGEX_ANSI_COLOR: 's/\x1b\[[0-9;]*[mGKHF]//g'
  REGEX_MAKE_OUTPUT: '/^g*make\[1]: \(Enter\|Leav\)ing directory ''/d'

permissions: {}

jobs:
  check-uid:
    name: Check Vial UIDs
    runs-on: ubuntu-latest

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Verify Vial UID is unique per-keyboard
      run: python3 util/ci_vial_verify_uid.py

  build-default:
    name: Build default keymaps for Vial
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07 
    env:
      KEYMAP: default

    steps:
    - name: (actions) Checkout Vial repo (sparse)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive
        sparse-checkout: |
          /*
          !keyboards/*
          keyboards/israfel
          quantum/
          builddefs/
          lib/
          platforms/
          tmk_core/
          drivers/
          layouts/
          users/
          data/
          util/
          modules/
          Makefile
          paths.mk
          *.mk
          requirements*.txt
          setup.cfg

    - name: Build
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        if ! qmk compile -kb israfel -km "${KEYMAP}";
          then
          echo "::error::Failed to build israfel:${KEYMAP}"
          exit 1
        fi
    - name: List generated files
      run: |
        echo "=== Files in .build/ ==="
        find .build -name "israfel_${KEYMAP}.*" -type f 2>/dev/null || echo "No files found in .build/"
        echo ""
        echo "=== Files in root directory ==="
        ls -lh israfel_${KEYMAP}.* 2>/dev/null || echo "No files found in root"
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: israfel-${{ env.KEYMAP }}-firmware
        path: |
          .build/israfel_${{ env.KEYMAP }}.hex
          .build/israfel_${{ env.KEYMAP }}.uf2
          israfel_${{ env.KEYMAP }}.hex
          israfel_${{ env.KEYMAP }}.uf2
        if-no-files-found: warn
        retention-days: 30

  build-vial:
    name: Build Vial keymaps
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07 
    env:
      KEYMAP: vial

    steps:
    - name: (actions) Checkout Vial repo (sparse)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive
        sparse-checkout: |
          /*
          !keyboards/*
          keyboards/israfel
          quantum/
          builddefs/
          lib/
          platforms/
          tmk_core/
          drivers/
          layouts/
          users/
          data/
          util/
          modules/
          Makefile
          paths.mk
          *.mk
          requirements*.txt
          setup.cfg

    - name: Build
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        if ! qmk compile -kb israfel -km "${KEYMAP}";
          then
          echo "::error::Failed to build israfel:${KEYMAP}"
          exit 1
        fi
    - name: List generated files
      run: |
        echo "=== Files in .build/ ==="
        find .build -name "israfel_${KEYMAP}.*" -type f 2>/dev/null || echo "No files found in .build/"
        echo ""
        echo "=== Files in root directory ==="
        ls -lh israfel_${KEYMAP}.* 2>/dev/null || echo "No files found in root"
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: israfel-${{ env.KEYMAP }}-firmware
        path: |
          .build/israfel_${{ env.KEYMAP }}.hex
          .build/israfel_${{ env.KEYMAP }}.uf2
          israfel_${{ env.KEYMAP }}.hex
          israfel_${{ env.KEYMAP }}.uf2
        if-no-files-found: warn
        retention-days: 30
