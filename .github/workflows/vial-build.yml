name: Vial Build
on: [push]
jobs:
  build:
    name: Build israfel:vial
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    steps:
    - name: (actions) Checkout Vial repo (sparse)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive
        sparse-checkout: |
          /*
          !keyboards/*
          keyboards/israfel
          quantum/
          builddefs/
          lib/
          platforms/
          tmk_core/
          drivers/
          layouts/
          users/
          data/
          util/
          modules/
          Makefile
          paths.mk
          *.mk
          requirements*.txt
          setup.cfg
    - name: Build
      run: |
        git config --global --add safe.directory $(pwd)
        qmk compile -kb israfel -km vial
    - name: List generated files
      run: |
        echo "=== Files in .build/ ==="
        find .build -name "israfel_vial.*" -type f 2>/dev/null || echo "No files found in .build/"
        echo ""
        echo "=== Files in root directory ==="
        ls -lh israfel_vial.* 2>/dev/null || echo "No files found in root"
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: israfel-vial-firmware
        path: |
          .build/israfel_vial.*
          israfel_vial.*
        if-no-files-found: warn
        retention-days: 30